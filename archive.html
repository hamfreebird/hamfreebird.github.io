<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <title>归档 · freebird的自留地</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="shell-header"></div>
  <main>
    <section class="wrap section" style="padding-bottom:36px">
      <div class="eyebrow reveal">All tracks</div>
      <h1 class="section-title reveal" style="font-size:clamp(36px,6vw,58px);margin:14px 0">飞行归档</h1>
      <p class="muted reveal">所有留下的轨迹，按时间倒序排列。</p>
    </section>
    <section class="wrap" style="padding-bottom:80px">
      <div class="filter-bar reveal" id="tagBar"></div>
      <div class="archive-list" id="archiveList"></div>
      <div class="empty reveal" id="archiveEmpty" hidden>
        <div id="archiveBird"></div><h3>暂无记录</h3>
        <p>这里还没有文章。写下第一篇，让天空热闹起来。</p>
        <a class="btn btn-ghost" href="admin.html">前往后台</a>
      </div>
      <div class="reveal" id="pagination" style="display:flex;justify-content:center;gap:10px;margin-top:30px"></div>
    </section>
  </main>
  <div id="shell-footer"></div>
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/archive.js"></script>
</body>
</html>
