name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages v4+ 需要读取 artifact；显式声明 permissions 时未列出的作用域会被置为 none。
  actions: read
  pages: write
  id-token: write

concurrency:
  group: freebird-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html post.html archive.html about.html admin.html 404.html favicon.svg .nojekyll _site/
          cp -r assets content _site/

      # 按运行尝试次数命名：重跑失败作业时不会与上一次的 artifact 重名。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Artifact 索引服务在上传后存在短暂延迟，给 ListArtifacts 留出传播时间。
      - name: Wait for artifact index
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
