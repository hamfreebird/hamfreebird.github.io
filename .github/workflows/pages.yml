name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages 需要读取本次运行上传的 github-pages artifact；
  # 显式声明 permissions 时未列出的作用域会被置为 none。
  actions: read
  pages: write
  id-token: write

concurrency:
  group: freebird-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html post.html archive.html about.html admin.html 404.html favicon.svg .nojekyll _site/
          cp -r assets content _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
