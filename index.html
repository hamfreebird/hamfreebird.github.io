<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="freebird的自留地 —— fly free · write true。一个关于自由、代码与生活的自留地。">
  <title>freebird的自留地 · fly free, write true</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="loading">
  <div id="shell-header"></div>
  <main>
    <section class="hero wrap">
      <div class="hero-inner">
        <div>
          <div class="hero-badge"><i></i> FREE · WILD · LIGHT</div>
          <h1><span class="gradient">freebird</span><span class="small">的自留地 · fly free, write true</span></h1>
          <p class="hero-desc">一块留给风、文字与自由的空地。<br>偶尔飞行，常常记录；在这里，思想不必落地。</p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#posts">开始探索
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </a>
            <a class="btn btn-ghost" href="about.html">关于 freebird</a>
          </div>
          <div class="hero-meta">
            <div><strong id="statPosts">—</strong>文章</div>
            <div><strong id="statViews">—</strong>阅读</div>
            <div><strong id="statComments">—</strong>留言</div>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div>
          <svg class="hero-star star-icon" viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <defs>
              <radialGradient id="starHalo" cx="60" cy="60" r="30" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
                <stop offset=".12" stop-color="#dff7ff" stop-opacity=".7"/>
                <stop offset=".42" stop-color="#7dd3fc" stop-opacity=".2"/>
                <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="spikeH" x1="6" y1="60" x2="114" y2="60" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#c7ecff" stop-opacity="0"/>
                <stop offset=".34" stop-color="#c7ecff" stop-opacity=".16"/>
                <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
                <stop offset=".66" stop-color="#c7ecff" stop-opacity=".16"/>
                <stop offset="1" stop-color="#c7ecff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="spikeV" x1="60" y1="6" x2="60" y2="114" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#c7ecff" stop-opacity="0"/>
                <stop offset=".34" stop-color="#c7ecff" stop-opacity=".16"/>
                <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
                <stop offset=".66" stop-color="#c7ecff" stop-opacity=".16"/>
                <stop offset="1" stop-color="#c7ecff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="spikeD1" x1="24" y1="24" x2="96" y2="96" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#a8dfff" stop-opacity="0"/>
                <stop offset=".5" stop-color="#eaf9ff" stop-opacity=".32"/>
                <stop offset="1" stop-color="#a8dfff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="spikeD2" x1="96" y1="24" x2="24" y2="96" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#a8dfff" stop-opacity="0"/>
                <stop offset=".5" stop-color="#eaf9ff" stop-opacity=".32"/>
                <stop offset="1" stop-color="#a8dfff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="30" fill="url(#starHalo)"/>
            <g class="rays">
              <path d="M6 60H114" stroke="url(#spikeH)" stroke-width="1.2"/>
              <path d="M60 6V114" stroke="url(#spikeV)" stroke-width="1.2"/>
              <path d="M24 24L96 96" stroke="url(#spikeD1)" stroke-width=".8"/>
              <path d="M96 24L24 96" stroke="url(#spikeD2)" stroke-width=".8"/>
            </g>
            <circle class="core" cx="60" cy="60" r="3.4" fill="#ffffff"/>
            <g opacity=".5" stroke="#d9f4ff" stroke-width=".6">
              <path d="M22 28h8M26 24v8"/><circle cx="26" cy="28" r=".8" fill="#fff" stroke="none"/>
              <path d="M94 34h7M97.5 30.5v7"/><circle cx="97.5" cy="34" r=".7" fill="#fff" stroke="none"/>
              <path d="M30 90h7M33.5 86.5v7"/><circle cx="33.5" cy="90" r=".7" fill="#fff" stroke="none"/>
              <path d="M90 92h8M94 88v8"/><circle cx="94" cy="92" r=".8" fill="#fff" stroke="none"/>
              <path d="M60 16h6M63 13v6"/><circle cx="63" cy="16" r=".6" fill="#fff" stroke="none"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="scroll-cue">SCROLL TO FLY</div>
    </section>

    <section class="section wrap" id="posts">
      <div class="section-head reveal">
        <div><div class="eyebrow">Latest flights</div><h2 class="section-title">最近的飞行记录</h2></div>
        <div class="section-sub" id="sourceChip">正在寻找数据源…</div>
      </div>
      <div class="filter-bar reveal" id="tagBar"></div>
      <div class="post-grid" id="postGrid"></div>
      <div class="empty reveal" id="emptyState" hidden>
        <div id="emptyBird"></div>
        <h3>天空还很安静</h3>
        <p>这里还没有文章。连接后端后，在管理后台写下第一篇吧。</p>
        <a class="btn btn-ghost" href="admin.html">前往管理后台</a>
      </div>
      <div style="text-align:center;margin-top:34px" class="reveal">
        <a class="btn btn-ghost" href="archive.html">查看全部归档 →</a>
      </div>
    </section>

    <section class="section wrap" id="subscribe">
      <div class="about-card reveal" style="display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:center">
        <div><div class="eyebrow">Stay in touch</div><h2 style="font-size:28px;margin:12px 0">用一封邮件，追随下一次起飞</h2>
          <p>有更新时写给你。不打扰，不贩卖焦虑。</p></div>
        <form class="editor" id="subscribeForm">
          <input class="input" type="email" name="email" placeholder="你的邮箱地址" required aria-label="订阅邮箱">
          <button class="btn btn-primary" type="submit">订阅更新</button>
        </form>
      </div>
    </section>
  </main>
  <div id="shell-footer"></div>
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/home.js"></script>
</body>
</html>
